<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Youtube</title>
    <link rel="stylesheet" href="/css/flexbox.css">

    <style>
        .flex-container {
            display: flex;
            background-color: #515797;
            padding: 5px;
            flex-direction: row;
            justify-content: space-between;
        }

        .flex-container div {
            background-color: #909cda;
            margin: 5px;
            padding: 10px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #0f0f0f;
            font-size: 2rem;
        }

h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #0f0f0f;
            font-size: 2rem;
        }

        /* Contenedor principal en una sola fila con Flexbox */
        .galeria-videos {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        /* Cada tarjeta de video */
        .video-card {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Estilo y dimensionamiento del iframe mediante CSS */
        .video-card iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

    </style>
</head>
